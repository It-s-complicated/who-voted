  <rect width="1600" height="1080" fill="#fdfcfa"/>
  <g class="sans">
    <text x="60" y="54" class="eyebrow red">WHO VOTED? / MASCOT STUDIES</text>
    <text x="1540" y="54" text-anchor="end" class="eyebrow muted">CHARACTER EXPLORATION — 01</text>
    <text x="58" y="132" class="serif ink" font-size="62">A good nose for the numbers.</text>
    <text x="61" y="173" class="copy">Three original directions. A white coat, long black ears, and a friendly, curious face.</text>
    <path d="M60 202 H1540" stroke="#1c1b1a" stroke-width="3"/>
    <path d="M552 234 V896 M1048 234 V896" stroke="#c9c5be"/>

    <text x="64" y="252" class="eyebrow red">01 / SOFT &amp; FRIENDLY</text>
    <text x="64" y="297" class="serif ink name">The companion</text>
    <text x="64" y="326" class="copy">A little head tilt. A very good listener.</text>
    <use href="#companion" x="97" y="353" width="380" height="380"/>
    <path d="M64 753 H516" stroke="#c9c5be"/>
    <text x="64" y="786" class="copy">The warmest, most characterful option.</text>
    <text x="64" y="813" class="copy">A welcoming face for the landing page.</text>
    <use href="#companion" x="64" y="839" width="54" height="54"/>
    <text x="137" y="862" class="fine">Seated silhouette</text>
    <text x="137" y="882" class="fine">Easy to give more poses later.</text>

    <text x="586" y="252" class="eyebrow red">02 / CURIOUS &amp; EDITORIAL</text>
    <text x="586" y="297" class="serif ink name">The inquisitive one</text>
    <text x="586" y="326" class="copy">A spaniel with a nose for the details.</text>
    <use href="#inquisitive" x="606" y="356" width="390" height="390"/>
    <path d="M586 753 H1010" stroke="#c9c5be"/>
    <text x="586" y="786" class="copy">A longer muzzle and a quieter expression.</text>
    <text x="586" y="813" class="copy">A natural fit beside notes and explainers.</text>
    <use href="#inquisitive" x="586" y="839" width="54" height="54"/>
    <text x="659" y="862" class="fine">Three-quarter portrait</text>
    <text x="659" y="882" class="fine">Less babyish. More observant.</text>

    <text x="1082" y="252" class="eyebrow red">03 / SMALL &amp; PLAYFUL</text>
    <text x="1082" y="297" class="serif ink name">The little observer</text>
    <text x="1082" y="326" class="copy">Just ears, eyes, and a little curiosity.</text>
    <use href="#observer" x="1101" y="385" width="402" height="402"/>
    <path d="M1082 753 H1536" stroke="#c9c5be"/>
    <text x="1082" y="786" class="copy">A compact face that peeks over a rule.</text>
    <text x="1082" y="813" class="copy">A small companion, not the main event.</text>
    <use href="#observer" x="1082" y="839" width="64" height="64"/>
    <text x="1165" y="862" class="fine">Compact peeking mark</text>
    <text x="1165" y="882" class="fine">For a header or a quiet footer cameo.</text>

    <path d="M60 925 H1540" stroke="#1c1b1a" stroke-width="2"/>
    <text x="62" y="966" class="eyebrow red">ONE SHARED DESIGN LANGUAGE</text>
    <text x="62" y="999" class="copy">Paper white. Charcoal ink. A tiny red collar. No party symbols, no visual noise around the data.</text>
    <text x="62" y="1043" class="fine">Original editable SVG artwork • Concept studies, not yet placed on the site</text>
    <text x="1538" y="1043" text-anchor="end" class="fine">WHO VOTED? / 01—03</text>
  </g>
</svg>
