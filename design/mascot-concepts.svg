      .serif { font-family: 'Liberation Serif', Georgia, serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .name { font-size: 32px; }
      .copy { font-size: 18px; fill: #55524d; }
      .fine { font-size: 14px; fill: #6b6760; }
      .dog { stroke: #1c1b1a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .white { fill: #fff; }
      .black { fill: #1c1b1a; }
      .line { fill: none; }
    </style>

