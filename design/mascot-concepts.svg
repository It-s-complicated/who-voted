<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">Who voted? — three original spaniel mascot concepts</title>
  <desc id="description">Three black-and-white dogs with long floppy ears and rounded, beagle-like faces: a seated companion, an inquisitive three-quarter portrait, and a small dog peeking over a rule. An editorial concept sheet in the site's paper, ink, and red palette.</desc>
